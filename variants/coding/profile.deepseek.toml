[profile]
name = "coding-deepseek"

[model]
provider = "openai-compatible"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
api_key_keyring = "keel:deepseek"
supports_reasoning = true
thinking_budget = 0
max_output_tokens = 4096
context_window = 128000

[context]
stages = ["system", "memory", "history", "latest"]
budget_tokens = 16000

[tools]
visible = ["echo", "read_file", "write_file", "list_trash", "restore_file", "list_dir", "code_search", "make_dir", "move_file", "delete_file", "shell", "todo"]
budget = 1000
plan_mode = false

[verification]
mode = "none"

[permission]
level = "workspace_auto"

[interaction]
timeout_ms = 300000
on_timeout = "defer_and_continue"
max_per_turn = 4

[persona]
system = "prompts/coding.md"
