[profile]
name = "coding-consumer"

[model]
provider = "openai-compatible"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
api_key_keyring = "keel:deepseek"
supports_reasoning = true
thinking_budget = 0
max_output_tokens = 4096
context_window = 128000

[context]
stages = ["system", "task_state", "memory", "history", "latest"]
budget_tokens = 24000

[tools]
visible = ["read_file", "write_file", "list_dir", "code_search", "make_dir", "shell", "todo", "spawn_agent"]
budget = 1000
plan_mode = false

[verification]
mode = "none"

[permission]
level = "full_auto"

[interaction]
timeout_ms = 300000
on_timeout = "defer_and_continue"
max_per_turn = 4

[persona]
system = "prompts/coding.md"
