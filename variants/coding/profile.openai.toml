[profile]
name = "coding-openai"

[model]
provider = "openai-compatible"
model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
thinking_budget = 0
max_output_tokens = 4096

[context]
stages = ["system", "history", "latest"]
budget_tokens = 16000

[tools]
visible = ["echo", "read_file", "write_file", "list_dir", "code_search", "shell"]
budget = 12
plan_mode = false

[verification]
mode = "none"

[permission]
level = "workspace_auto"

[interaction]
timeout_ms = 300000
on_timeout = "defer_and_continue"
max_per_turn = 4

[persona]
system = "prompts/coding.md"
