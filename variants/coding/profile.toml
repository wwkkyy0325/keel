[profile]
name = "coding"

[model]
provider = "mock"
model = "mock-coding"
thinking_budget = 1024
max_output_tokens = 1024

[context]
stages = ["system", "memory", "history", "latest"]
budget_tokens = 16000

[tools]
visible = ["echo", "read_file", "write_file", "list_trash", "restore_file", "list_dir", "code_search", "make_dir", "move_file", "delete_file", "shell", "todo"]
budget = 1000

[verification]
mode = "none"

[permission]
level = "workspace_auto"

[persona]
system = "prompts/coding.md"
