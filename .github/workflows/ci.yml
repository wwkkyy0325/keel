name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Several command and MCP tests use `python` as a portable fixture.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    # The cargo-deny action is Linux-only; keep it in its own job instead of
    # adding a runner condition inside the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The kernel crates must build and pass their tests without the host,
      # and the minimal host example must run on every platform.
      - run: cargo test -p keel-core -p keel-policy -p keel-runtime -p keel-model-openai
      - run: cargo run -p keel-runtime --example minimal_turn

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile evals/harness/*.py
      - name: Validate dataset importer fixtures
        run: |
          set -euo pipefail
          python evals/harness/import_public.py \
            --dataset humaneval \
            --input evals/harness/fixtures/humaneval_sample.jsonl \
            --output /tmp/he_cases
          python evals/harness/import_public.py \
            --dataset mbpp \
            --input evals/harness/fixtures/mbpp_sample.jsonl \
            --output /tmp/mbpp_cases
          for kind in he mbpp; do
            case_dir=$(find "/tmp/${kind}_cases" -mindepth 1 -maxdepth 1 -type d | head -1)
            workspace=$(mktemp -d)
            cp -R "$case_dir/setup/." "$workspace/"
            if bash "$case_dir/verify.sh" "$workspace"; then
              echo "setup unexpectedly passed for $kind"
              exit 1
            fi
            cp -R "$case_dir/reference/." "$workspace/"
            bash "$case_dir/verify.sh" "$workspace"
          done
