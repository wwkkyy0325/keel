[workspace]
resolver = "2"
members = [
  "crates/keel-core",
  "crates/keel-model-openai",
  "crates/keel-runtime",
  "hosts/keel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
keel-core = { version = "0.1.0", path = "crates/keel-core" }
keel-model-openai = { version = "0.1.0", path = "crates/keel-model-openai" }
keel-runtime = { version = "0.1.0", path = "crates/keel-runtime" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls-native-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "fs",
  "io-util",
  "net",
] }
toml = "0.8"
