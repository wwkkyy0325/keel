[workspace]
resolver = "2"
members = [
  "crates/keel-core",
  "crates/keel-model-anthropic",
  "crates/keel-model-openai",
  "crates/keel-policy",
  "crates/keel-runtime",
  "crates/keel-testkit",
  "hosts/keel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
dotenvy = "0.15"
keel-core = { version = "0.1.0", path = "crates/keel-core" }
keel-model-anthropic = { version = "0.1.0", path = "crates/keel-model-anthropic" }
keel-model-openai = { version = "0.1.0", path = "crates/keel-model-openai" }
keel-policy = { version = "0.1.0", path = "crates/keel-policy" }
keel-runtime = { version = "0.1.0", path = "crates/keel-runtime" }
keel-testkit = { version = "0.1.0", path = "crates/keel-testkit" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls-native-roots",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "fs",
  "io-std",
  "io-util",
  "net",
  "process",
] }
toml = "0.8"
